<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContextSwitch Studio — Gemma 2 2B Neural Prompt Engine</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="brand">
            <span class="logo-icon">⚡</span>
            <h1>ContextSwitch <span class="tag">Gemma 2 2B Studio</span></h1>
        </div>
        <div class="system-status">
            <span class="pill" id="gemma-status">🧠 Gemma 2 2B: Initializing...</span>
            <span class="pill" id="sentry-status">📈 Sentry Traced</span>
        </div>
    </header>

    <main class="container">
        <!-- Navigation Tabs -->
        <nav class="tabs-nav">
            <button class="tab-btn active" id="tab-btn-compress" onclick="switchTab('compress')">🗜️ Gemma 2 2B Entropy Compressor</button>
            <button class="tab-btn" id="tab-btn-handoff" onclick="switchTab('handoff')">🔄 Context Handoff</button>
        </nav>

        <!-- Tab 1: Prompt Compressor -->
        <section id="tab-compress" class="tab-pane active">
            <div class="panel-grid">
                <div class="card input-card">
                    <div class="card-header">
                        <h2>Input Developer Prompt</h2>
                        <div class="mode-select">
                            <label for="compress-mode">Mode:</label>
                            <select id="compress-mode">
                                <option value="hybrid" selected>🔄 Hybrid (Rules + Gemma API Rewrite)</option>
                                <option value="rule">📏 Deterministic Rule-Based</option>
                                <option value="gemma_generative">🧠 Gemma 2 Generative Rewrite</option>
                            </select>
                        </div>
                    </div>
                    <div class="drop-rate-select">
                        <label for="drop-rate">Pruning Intensity (Tokens to Drop):</label>
                        <select id="drop-rate">
                            <option value="0.20">20% (Conservative)</option>
                            <option value="0.30">30% (Moderate)</option>
                            <option value="0.40" selected>40% (Recommended / Standard)</option>
                            <option value="0.50">50% (Aggressive)</option>
                        </select>
                    </div>
                    <textarea id="compress-input" placeholder="Paste your verbose developer prompt here with code snippets or instructions... (e.g., 'Can you please kindly help me write a function to connect SQLite with pooling? Thank you!')"></textarea>
                    <div class="action-bar">
                        <span id="input-token-count" class="token-count">0 tokens</span>
                        <button id="btn-run-compress" class="primary-btn" onclick="runCompression()">Compress with Gemma 2</button>
                    </div>
                </div>

                <div class="card output-card">
                    <div class="card-header">
                        <h2>Sparse Compressed Output</h2>
                        <button class="secondary-btn" id="btn-copy-compress" onclick="copyCompressed()">📋 Copy</button>
                    </div>
                    <textarea id="compress-output" readonly placeholder="Optimized token slice will appear here in sub-milliseconds..."></textarea>
                    
                    <div class="engine-badge-bar">
                        <span class="info-tag" id="stat-engine">Engine: Ready</span>
                        <span class="info-tag" id="stat-latency">Latency: -- ms</span>
                    </div>

                    <div class="metrics-bar">
                        <div class="metric">
                            <span class="label">Original:</span>
                            <span id="stat-orig" class="val">0</span>
                        </div>
                        <div class="metric">
                            <span class="label">Compressed:</span>
                            <span id="stat-comp" class="val">0</span>
                        </div>
                        <div class="metric highlight">
                            <span class="label">Tokens Saved:</span>
                            <span id="stat-saved" class="val">0 (0%)</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Tab 2: Context Handoff -->
        <section id="tab-handoff" class="tab-pane">
            <div class="panel-grid">
                <div class="card input-card">
                    <div class="card-header">
                        <h2>Developer Conversation / Debug Log</h2>
                        <input type="text" id="project-name-input" placeholder="Project Name" value="ContextSwitch-Core">
                    </div>
                    <textarea id="handoff-input" placeholder="Paste chat log, terminal output, or multi-turn discussion when switching AI models..."></textarea>
                    <div class="action-bar">
                        <button id="btn-run-handoff" class="primary-btn" onclick="runHandoff()">Generate Handoff Artifact</button>
                    </div>
                </div>

                <div class="card output-card">
                    <div class="card-header">
                        <h2>Lossless Handoff Artifact (.md)</h2>
                        <button class="secondary-btn" id="btn-copy-handoff" onclick="copyHandoff()">📋 Copy for Next LLM</button>
                    </div>
                    <textarea id="handoff-output" readonly placeholder="Universal System Prompt / Markdown handoff will appear here..."></textarea>
                </div>
            </div>
        </section>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
